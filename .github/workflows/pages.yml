# Builds PaiNo and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/
name: Publish to GitHub Pages

on:
  push:
    branches: [ccr-452b2d58-5da2m6, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Prepare for GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # deep links like /insights load the app
          touch dist/.nojekyll               # serve files as-is
      - name: Push to gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
